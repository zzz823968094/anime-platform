# 生产环境配置
server:
  port: 8081

spring:
  application:
    name: user-service
  
  # 数据源配置（生产环境）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 生产环境使用环境变量或配置中心
    url: ${DB_URL:jdbc:mysql://localhost:3306/anime_platform?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    
    # HikariCP连接池配置（生产环境优化参数）
    hikari:
      # 最小空闲连接数
      minimum-idle: 10
      # 最大连接池大小（根据服务器性能调整）
      maximum-pool-size: 50
      # 连接超时时间（毫秒）
      connection-timeout: 30000
      # 空闲连接超时时间（毫秒）
      idle-timeout: 600000
      # 连接最大生命周期（毫秒）- 30分钟
      max-lifetime: 1800000
      # 连接测试查询
      connection-test-query: SELECT 1
      # 自动提交
      auto-commit: true
      # 池名称
      pool-name: AnimeHikariCP
  
  # Redis配置（生产环境）
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          # 最大活跃连接数
          max-active: 50
          # 最大空闲连接数
          max-idle: 20
          # 最小空闲连接数
          min-idle: 10
          # 连接超时时间（毫秒）
          max-wait: 3000ms
        shutdown-timeout: 100ms

# MyBatis-Plus配置
mybatis-plus:
  configuration:
    # 驼峰命名转换
    map-underscore-to-camel-case: true
    # 生产环境关闭SQL日志
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  mapper-locations: classpath:mapper/*.xml
  global-config:
    db-config:
      # 主键策略：雪花算法
      id-type: ASSIGN_ID
      # 逻辑删除字段
      logic-delete-field: isDeleted
      # 逻辑删除值
      logic-delete-value: 1
      # 逻辑未删除值
      logic-not-delete-value: 0

# JWT配置（生产环境使用环境变量）
jwt:
  # 密钥（生产环境必须使用强密钥，建议从环境变量获取）
  secret: ${JWT_SECRET:anime-platform-prod-secret-key-change-in-production-2026}
  # Token过期时间（秒）- 7天
  expiration: 604800
  # Token前缀
  token-prefix: Bearer 
  # Token请求头名称
  header: Authorization

# 日志配置（生产环境）
logging:
  level:
    root: WARN
    com.anime: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    # 日志文件路径
    name: /var/log/anime-platform/user-service/application.log
    # 日志文件最大大小
    max-size: 100MB
    # 日志文件保留天数
    max-history: 30
  logback:
    rollingpolicy:
      # 日志文件总大小上限
      total-size-cap: 10GB
